  /orders:
    post:
      summary: Create a new order (Authenticated user only, after payment verification)
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products
                - totalAmount
                - paymentStatus
              properties:
                products:
                  type: array
                  items:
                    type: object
                    required:
                      - product
                      - quantity
                    properties:
                      product:
                        type: string
                        example: 654c2a00a1b2c3d4e5f6a7c0
                      quantity:
                        type: number
                        format: integer
                        example: 1
                totalAmount:
                  type: number
                  format: float
                  example: 15000.00
                paymentStatus:
                  type: string
                  enum: [pending, paid, failed]
                  example: paid
                razorpayOrderId:
                  type: string
                  example: order_xxxxxxxxxxxxxx
                razorpayPaymentId:
                  type: string
                  example: pay_xxxxxxxxxxxxxx
                razorpaySignature:
                  type: string
                  example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      summary: Get all orders for the authenticated user (with pagination)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: number
            default: 10
          description: Number of items per page
        - in: query
          name: sort
          schema:
            type: string
            default: -createdAt
          description: Sort field (prefix with - for descending)
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: User orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: number
                    example: 1
                  totalDocs:
                    type: number
                    example: 50
                  page:
                    type: number
                    example: 1
                  pages:
                    type: number
                    example: 1
                  limit:
                    type: number
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

